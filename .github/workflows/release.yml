name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    # ubuntu-24.04 is x86_64. We run the Linux x86_64 binary to check
    # --version, so the runner must match that one artifact. ubuntu-latest
    # could become ARM. The macOS and Linux aarch64 binaries are not run here.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Check tag matches build.zig.zon
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          major="${version%%.*}"
          minor="${version#*.}"
          case "$tag" in
            v*.*) ;;
            *)
              echo "tag must look like v1.0: $tag" >&2
              exit 1
              ;;
          esac
          case "$major$minor" in
            *[!0-9]*) bad=1 ;;
            *) bad= ;;
          esac
          if [ -n "$bad" ] || [ -z "$major" ] || [ -z "$minor" ] || [ "$minor" != "${minor%%.*}" ]; then
            echo "tag must look like v1.0: $tag" >&2
            exit 1
          fi
          zon_version=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -n1)
          if [ -z "$zon_version" ]; then
            echo "could not read .version from build.zig.zon" >&2
            exit 1
          fi
          # Package version keeps a 0 patch. The tag leaves it off: zon 1.0.0 is tag v1.0.
          if [ "$zon_version" != "${version}.0" ]; then
            echo "tag $tag needs build.zig.zon version ${version}.0, found $zon_version" >&2
            exit 1
          fi

      - name: Build release binaries
        run: |
          # Linux builds are musl so one file runs on glibc and musl systems.
          # macOS has no musl target.
          mkdir -p dist
          pack() {
            target="$1"
            asset="$2"
            stage="$RUNNER_TEMP/stage-$asset"
            rm -rf "$stage"
            zig build -Doptimize=ReleaseSafe -Dtarget="$target" --prefix "$stage"
            cp "$stage/bin/goal" "dist/$asset"
            chmod 755 "dist/$asset"
          }
          pack x86_64-linux-musl goal-linux-x86_64
          pack aarch64-linux-musl goal-linux-aarch64
          pack x86_64-macos goal-macos-x86_64
          pack aarch64-macos goal-macos-aarch64

      - name: Check Linux x86_64 version
        run: |
          version="${GITHUB_REF_NAME#v}"
          got=$(./dist/goal-linux-x86_64 --version)
          want="goal $version"
          if [ "$got" != "$want" ]; then
            echo "goal --version was '$got', expected '$want'" >&2
            exit 1
          fi

      - name: Stage checksums
        run: |
          cd dist
          sha256sum \
            goal-linux-x86_64 \
            goal-linux-aarch64 \
            goal-macos-x86_64 \
            goal-macos-aarch64 \
            > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "goal ${version}" \
            dist/goal-linux-x86_64 \
            dist/goal-linux-aarch64 \
            dist/goal-macos-x86_64 \
            dist/goal-macos-aarch64 \
            dist/SHA256SUMS
